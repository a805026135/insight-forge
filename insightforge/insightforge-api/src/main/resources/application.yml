server:
  port: 8080

spring:
  application:
    name: insightforge
  # Phase 1：迁移到 MySQL 后，启动时自动建表 + 写入种子数据（与 local profile 共用 schema.sql/data.sql）
  sql:
    init:
      mode: always
  datasource:
    url: jdbc:mysql://localhost:3306/insightforge?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: insightforge
    password: insightforge
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      retries: 3
    consumer:
      group-id: insightforge-default
      auto-offset-reset: earliest

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.insightforge: INFO
