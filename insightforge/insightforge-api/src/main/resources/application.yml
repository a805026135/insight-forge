server:
  port: 8080

spring:
  application:
    name: insightforge
  # Phase 1：迁移到 MySQL 后，启动时自动建表 + 写入种子数据（与 local profile 共用 schema.sql/data.sql）
  sql:
    init:
      mode: always
  datasource:
    url: jdbc:mysql://localhost:3306/insightforge?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: insightforge
    password: insightforge
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      # —— Phase 4 生产者可靠性 ——
      acks: all                       # 所有 in-sync 副本都收到才算成功，防丢
      retries: 3                      # 网闪自动重试
      enable-idempotence: true        # 配合 acks=all + retries，broker 端去重，防重
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: insightforge-default
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.insightforge: INFO
