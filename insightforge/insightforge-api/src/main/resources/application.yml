server:
  port: 8080

spring:
  application:
    name: insightforge
  # Phase 14.4：表结构与种子由 Flyway 统一管理（db/migration/*.sql），
  # 同一份迁移同时服务 H2(local) 与 MySQL(integration)，不再手工同步三份 SQL。
  flyway:
    locations: classpath:db/migration
    # 已有数据库（旧 init 脚本建的表）按 V2 基线跳过 V1/V2；全新库正常全量迁移
    baseline-on-migrate: true
    baseline-version: 2
  datasource:
    url: jdbc:mysql://localhost:3306/insightforge?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: insightforge
    password: insightforge
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      # —— Phase 4 生产者可靠性 ——
      acks: all                       # 所有 in-sync 副本都收到才算成功，防丢
      retries: 3                      # 网闪自动重试
      enable-idempotence: true        # 配合 acks=all + retries，broker 端去重，防重
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: insightforge-default
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

management:
  endpoints:
    web:
      exposure:
        # Phase 14.4 安全收尾：只暴露 health（探活）+ prometheus（内网抓取），
        # 不再暴露 info/metrics 等含环境/Bean 细节的端点
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.insightforge: INFO

# ============================================================
# LLM 接入（Phase 14.2）：Agent 离线规划走真 DeepSeek。
# 默认关闭（本地/测试仍用确定性桩）；部署时通过环境变量开启：
#   INSIGHTFORGE_AGENT_DEEPSEEK_ENABLED=true
#   INSIGHTFORGE_AGENT_DEEPSEEK_API_KEY=<你的 Key>（不要写进仓库）
#   INSIGHTFORGE_AGENT_DEEPSEEK_MODEL=deepseek-v4-flash
# LLM 只在控制面离线规划出现，永不进秒杀热路径。
# ============================================================
insightforge:
  agent:
    deepseek:
      enabled: ${INSIGHTFORGE_AGENT_DEEPSEEK_ENABLED:false}
      api-key: ${INSIGHTFORGE_AGENT_DEEPSEEK_API_KEY:}
      base-url: ${INSIGHTFORGE_AGENT_DEEPSEEK_BASE_URL:https://api.deepseek.com}
      model: ${INSIGHTFORGE_AGENT_DEEPSEEK_MODEL:deepseek-chat}
    # 知识库 embedding（Phase 19）：DashScope text-embedding-v4，缺 key 自动降级本地向量
    embedding:
      provider: auto
      api-key: ${INSIGHTFORGE_AGENT_EMBEDDING_API_KEY:}
      base-url: ${INSIGHTFORGE_AGENT_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      model: ${INSIGHTFORGE_AGENT_EMBEDDING_MODEL:text-embedding-v4}
      dimensions: ${INSIGHTFORGE_AGENT_EMBEDDING_DIMENSIONS:1024}
      local-dimensions: ${INSIGHTFORGE_AGENT_EMBEDDING_LOCAL_DIMENSIONS:512}
    knowledge-base:
      enabled: ${INSIGHTFORGE_AGENT_KNOWLEDGE_BASE_ENABLED:true}
      max-chunk-chars: ${INSIGHTFORGE_AGENT_KB_MAX_CHUNK_CHARS:400}
      overlap-chars: ${INSIGHTFORGE_AGENT_KB_OVERLAP_CHARS:50}
      top-k: ${INSIGHTFORGE_AGENT_KB_TOP_K:4}
      seed-on-startup: ${INSIGHTFORGE_AGENT_KB_SEED_ON_STARTUP:true}
    # trace 里的 model_version 跟随实际模型名（未配置时保持本地桩名）
    model-version: ${insightforge.agent.deepseek.model:local-det-1.0}
  auth:
    # JWT 签名密钥（HS256 需要 ≥32 字节）。生产必须用环境变量覆盖！
    jwt-secret: ${INSIGHTFORGE_AUTH_JWT_SECRET:insightforge-demo-secret-please-override-0123456789}
    token-ttl-hours: ${INSIGHTFORGE_AUTH_TOKEN_TTL_HOURS:24}
