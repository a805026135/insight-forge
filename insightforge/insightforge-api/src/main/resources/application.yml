server:
  port: 8080

spring:
  application:
    name: insightforge
  # Phase 1：迁移到 MySQL 后，启动时自动建表 + 写入种子数据（与 local profile 共用 schema.sql/data.sql）
  # Phase 14.1 修正：默认/集成 profile 关闭 sql.init —— data.sql 含 DELETE，每次重启会清空订单/库存。
  # MySQL 的表结构与种子改由 docker-compose 挂载的 docker/mysql/init/*.sql 在「首次建卷」时初始化
  # （docker-entrypoint-initdb.d 只在数据卷为空时执行一次），重启不丢数据。local profile（H2 内存库）
  # 仍用 mode=always 每次从 schema.sql/data.sql 重建，零依赖冒烟不受影响。
  sql:
    init:
      mode: never
  datasource:
    url: jdbc:mysql://localhost:3306/insightforge?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: insightforge
    password: insightforge
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      # —— Phase 4 生产者可靠性 ——
      acks: all                       # 所有 in-sync 副本都收到才算成功，防丢
      retries: 3                      # 网闪自动重试
      enable-idempotence: true        # 配合 acks=all + retries，broker 端去重，防重
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: insightforge-default
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.insightforge: INFO

# ============================================================
# LLM 接入（Phase 14.2）：Agent 离线规划走真 DeepSeek。
# 默认关闭（本地/测试仍用确定性桩）；部署时通过环境变量开启：
#   INSIGHTFORGE_AGENT_DEEPSEEK_ENABLED=true
#   INSIGHTFORGE_AGENT_DEEPSEEK_API_KEY=<你的 Key>（不要写进仓库）
#   INSIGHTFORGE_AGENT_DEEPSEEK_MODEL=deepseek-v4-flash
# LLM 只在控制面离线规划出现，永不进秒杀热路径。
# ============================================================
insightforge:
  agent:
    deepseek:
      enabled: ${INSIGHTFORGE_AGENT_DEEPSEEK_ENABLED:false}
      api-key: ${INSIGHTFORGE_AGENT_DEEPSEEK_API_KEY:}
      base-url: ${INSIGHTFORGE_AGENT_DEEPSEEK_BASE_URL:https://api.deepseek.com}
      model: ${INSIGHTFORGE_AGENT_DEEPSEEK_MODEL:deepseek-chat}
    # trace 里的 model_version 跟随实际模型名（未配置时保持本地桩名）
    model-version: ${insightforge.agent.deepseek.model:local-det-1.0}
  auth:
    # JWT 签名密钥（HS256 需要 ≥32 字节）。生产必须用环境变量覆盖！
    jwt-secret: ${INSIGHTFORGE_AUTH_JWT_SECRET:insightforge-demo-secret-please-override-0123456789}
    token-ttl-hours: ${INSIGHTFORGE_AUTH_TOKEN_TTL_HOURS:24}
