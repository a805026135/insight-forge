# Nginx 入口（Phase 10）：统一反代 + 秒杀令牌桶限流 + WebSocket 升级。
# ⚠️ 沙箱未实跑（无 Docker），仅描述生产配置方式。

worker_processes auto;

events {
    worker_connections 10240;
}

http {
    # 必须引入 MIME 类型表，否则 JS/CSS 会被当成 text/plain 返回，
    # 浏览器按严格 MIME 校验拒绝执行模块脚本（页面白屏）
    include /etc/nginx/mime.types;

    # —— 令牌桶限流：每个客户端 IP 每秒最多 100 个请求，突发 20 立即处理 ——
    # 秒杀入口是系统命脉，必须在大门口就削峰，而不是让请求全压到 Redis/DB。
    limit_req_zone $binary_remote_addr zone=seckill_zone:10m rate=100r/s;

    upstream insightforge_api {
        server api:8080;
    }

    server {
        listen 80;
        server_name shance.xyz;

        # 前端静态资源（vite build 产物，挂载到 /usr/share/nginx/html）
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        # 秒杀热路径：令牌桶限流（突发 20，nodelay 立即放行，其余排队/拒）
        location /api/seckill {
            limit_req zone=seckill_zone burst=20 nodelay;
            proxy_pass http://insightforge_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 其余 API 正常反代
        location /api {
            proxy_pass http://insightforge_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 大屏 WebSocket：必须升级协议，否则连不上
        location /ws {
            proxy_pass http://insightforge_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }
    }

    # www 统一 301 到主域（避免两个域名被搜索引擎视为两个站点）
    server {
        listen 80;
        server_name www.shance.xyz;
        return 301 http://shance.xyz$request_uri;
    }
}
