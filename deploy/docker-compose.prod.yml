# InsightForge 生产编排（Phase 15）：与 docker-compose.yml（本地开发）的差异
#  - 公网只暴露 nginx 80；Grafana 仅绑定回环 127.0.0.1:3001，演示时走 SSH 隧道访问
#  - MySQL/Redis/Kafka/Prometheus 均不发布端口，只在容器网络内互通
#  - 面向 2C4G 内存调优：Java 堆 / Kafka 堆 / MySQL 连接数 / Prometheus 保留期
#  - JWT 密钥与 Grafana 密码为必填环境变量（deploy/.env 提供，不入库），缺省直接启动失败，
#    防止用默认密钥上线
#
# 用法（仓库根目录）：
#   cp deploy/.env.example deploy/.env   # 填入真实 Key 与随机 JWT 密钥
#   docker compose -f deploy/docker-compose.prod.yml up -d --build

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: insightforge
      MYSQL_USER: insightforge
      MYSQL_PASSWORD: insightforge
      MYSQL_ROOT_PASSWORD: root
    command:
      - "--max-connections=120"
      - "--innodb-buffer-pool-size=128M"
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5
    deploy:
      resources:
        limits: { memory: 768m }

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
    deploy:
      resources:
        limits: { memory: 128m }

  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # 4G 机器内存受限：Kafka 堆从默认 1G 压到 256M（演示流量下足够）
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx256m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      retries: 20
    deploy:
      resources:
        limits: { memory: 512m }

  api:
    build:
      context: ../insightforge
      dockerfile: ../deploy/Dockerfile.api
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: integration
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/insightforge
      SPRING_DATASOURCE_USERNAME: insightforge
      SPRING_DATASOURCE_PASSWORD: insightforge
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP-SERVERS: kafka:9092
      INSIGHTFORGE_AGENT_DEEPSEEK_ENABLED: ${INSIGHTFORGE_AGENT_DEEPSEEK_ENABLED:-true}
      INSIGHTFORGE_AGENT_DEEPSEEK_API_KEY: ${INSIGHTFORGE_AGENT_DEEPSEEK_API_KEY:-}
      INSIGHTFORGE_AGENT_DEEPSEEK_BASE_URL: ${INSIGHTFORGE_AGENT_DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      INSIGHTFORGE_AGENT_DEEPSEEK_MODEL: ${INSIGHTFORGE_AGENT_DEEPSEEK_MODEL:-deepseek-v4-flash}
      # 知识库 embedding（Phase 19）：缺 key 时后端自动用本地兜底向量，全链路仍可跑
      INSIGHTFORGE_AGENT_EMBEDDING_API_KEY: ${INSIGHTFORGE_AGENT_EMBEDDING_API_KEY:-}
      INSIGHTFORGE_AGENT_EMBEDDING_MODEL: ${INSIGHTFORGE_AGENT_EMBEDDING_MODEL:-text-embedding-v4}
      INSIGHTFORGE_AGENT_KNOWLEDGE_BASE_ENABLED: ${INSIGHTFORGE_AGENT_KNOWLEDGE_BASE_ENABLED:-true}
      INSIGHTFORGE_AUTH_JWT_SECRET: ${INSIGHTFORGE_AUTH_JWT_SECRET:?JWT 密钥未设置：请在 deploy/.env 配置 INSIGHTFORGE_AUTH_JWT_SECRET}
      # 4G 机器：固定 Java 堆，避免 JVM 按宿主机内存自动放大导致 OOM
      JAVA_TOOL_OPTIONS: "-Xmx512m -XX:MaxMetaspaceSize=192m"
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 768m }

  rule-engine-worker:
    build:
      context: ../insightforge
      dockerfile: ../deploy/Dockerfile.worker
      args:
        MODULE: insightforge-rule-engine
    depends_on: ["mysql", "redis", "kafka"]
    environment:
      SPRING_PROFILES_ACTIVE: integration
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/insightforge
      SPRING_DATASOURCE_USERNAME: insightforge
      SPRING_DATASOURCE_PASSWORD: insightforge
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP-SERVERS: kafka:9092
      JAVA_TOOL_OPTIONS: "-Xmx384m -XX:MaxMetaspaceSize=160m"
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 640m }

  nginx:
    image: nginx:1.27-alpine
    depends_on: ["api"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../insightforge-frontend/dist:/usr/share/nginx/html:ro
    ports: ["80:80"]
    deploy:
      resources:
        limits: { memory: 64m }

  prometheus:
    image: prom/prometheus:v2.54.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    deploy:
      resources:
        limits: { memory: 384m }

  grafana:
    image: grafana/grafana:11.2.0
    depends_on: ["prometheus"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?Grafana 密码未设置：请在 deploy/.env 配置 GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    # 只绑定本机回环：公网不可达，演示时用 SSH 隧道查看监控大屏
    ports: ["127.0.0.1:3001:3000"]
    deploy:
      resources:
        limits: { memory: 384m }

volumes:
  mysql-data:
  grafana-data:
